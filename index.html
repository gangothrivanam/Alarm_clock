<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alarm Clock</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <img src="alarm.png" alt="Clock">

    <h1>00:00:00 PM</h1>

    <div class="content">

        <div class="column">
            <select id="hour"></select>
        </div>

        <div class="column">
            <select id="minute"></select>
        </div>

        <div class="column">
            <select id="am/pm"></select>
        </div>

    </div>

    <button>Set Alarm</button>

</div>

<audio src="ringtone.mp3" id="ringtone" loop></audio>

<script src="script.js"></script>

</body>
</html>
